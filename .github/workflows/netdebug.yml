name: net debug

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 跟踪 fetch_models.sh
        run: |
          echo "=== bash -x 跑到失败为止 ==="
          bash -x scripts/fetch_models.sh > /tmp/out.txt 2> /tmp/err.txt
          echo "rc=$?"
          echo "--- stdout 尾部 ---"
          tail -30 /tmp/out.txt
          echo "--- stderr 尾部（含 -x 跟踪） ---"
          tail -60 /tmp/err.txt
